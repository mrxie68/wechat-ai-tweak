name: Build WeChat AI

on:
  push:
  workflow_dispatch:

jobs:
  build-dylib:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: 编译 dylib
        run: bash build.sh
      - name: 上传 dylib
        uses: actions/upload-artifact@v4
        with:
          name: wechat-ai-dylib
          path: wechat-ai.dylib

  package-deb:
    needs: build-dylib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wechat-ai-dylib
          path: artifact
      - name: 打包 deb
        run: |
          cp artifact/wechat-ai.dylib .
          bash package_deb.sh
      - name: 上传 deb
        uses: actions/upload-artifact@v4
        with:
          name: wechat-ai-deb
          path: wechat-ai_*.deb
